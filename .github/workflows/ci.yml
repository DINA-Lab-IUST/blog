name: CI

# Students writing posts/people files only trigger the fast content check.
# Template changes (code, config, styles, deps) run the full gate.
# Pull requests touching both run everything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      template: ${{ steps.filter.outputs.template }}
      content: ${{ steps.filter.outputs.content }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            template:
              - 'src/components/**'
              - 'src/layouts/**'
              - 'src/pages/**'
              - 'src/utils/**'
              - 'src/config/**'
              - 'src/styles/**'
              - 'src/data/papers.bib'
              - 'src/data/coauthors.yml'
              - 'src/content.config.ts'
              - 'astro.config.mjs'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'e2e/**'
              - 'scripts/**'
            content:
              - 'src/content/posts/**'
              - 'src/content/people/**'
              - 'src/data/papers.bib'
              - 'public/assets/img/**'

  content:
    name: Content check
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate frontmatter
        run: yarn content:check

  template:
    name: Type-check, lint, test, build
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn test:types

      - name: Lint
        run: yarn lint:ci

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
        env:
          ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://dina-lab-iust.github.io' }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || '/blog' }}
